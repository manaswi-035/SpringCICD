<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Calculator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 25px;
            font-size: 18px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Attendance Calculator</h1>

    <form action="/calculate" method="post">

        <input
            type="number"
            name="attended"
            placeholder="Classes Attended"
            min="0"
            required>

        <input
            type="number"
            name="total"
            placeholder="Total Classes"
            min="1"
            required>

        <br>

        <button type="submit">
            Calculate
        </button>

    </form>

    <!-- Display result after calculation -->

    <div class="result" th:if="${percentage != null}">

        <p>
            Classes Attended:
            <strong th:text="${attended}"></strong>
        </p>

        <p>
            Total Classes:
            <strong th:text="${total}"></strong>
        </p>

        <p>
            Attendance Percentage:
            <strong th:text="${percentage + '%'}"></strong>
        </p>

        <p>
            Status:
            <strong th:text="${status}"></strong>
        </p>

    </div>

</div>

</body>

</html>
